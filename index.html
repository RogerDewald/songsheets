<title>Songsheets</title>
<meta name="description" content="Write chord song sheets, transpose them to any key and export them as PDF, Word, ChordPro, text or HTML. Runs entirely in your browser.">
<meta name="theme-color" content="#1f45ff">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
  // Apply the saved theme before first paint, and add the web-app manifest only where it can load.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('songsheets:settings') || '{}');
      if (s.theme === 'light' || s.theme === 'night') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) { /* storage unavailable */ }
    if (/^https?:$/.test(location.protocol)) {
      var l = document.createElement('link');
      l.rel = 'manifest';
      l.href = 'manifest.webmanifest';
      document.head.appendChild(l);
    }
  })();
</script>
